[package]
name = "ghostlinkd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ghostlink-contracts.workspace = true
ghostlink-engine.workspace = true
fs2 = "0.4"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

[dev-dependencies]
# The service tests serve a dynamic key from a local HTTP server (see outline::pinned_client).
ghostlink-engine = { workspace = true, features = ["test-hooks"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading"] }

# Its own main: the test binary is also the stand-in tunnel worker the service starts.
[[test]]
name = "cleanup_barrier"
harness = false

[lints]
workspace = true
